<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CoC 7e — 探索者之幕</title>
<style>
:root{--bg-abyss:#06080c;--bg-deep:#0a0e14;--bg-primary:#0d1117;--bg-surface:#13181f;--bg-elevated:#1a1f28;--bg-hover:#1e2530;--text-parchment:#d4c5a9;--text-muted:#8b7d6b;--text-dim:#5a5245;--text-bright:#e8dcc8;--san-gold:#c4a35a;--san-gold-dim:#8a7340;--hp-crimson:#a83232;--hp-crimson-dim:#6b2020;--mp-arcane:#7b5ea7;--mp-arcane-dim:#4a3868;--success:#8fbc6a;--success-dim:#3a5a28;--fail:#c75050;--fail-dim:#6b2a2a;--critical:#e8a020;--supernatural:#6b4a8a;--border-dark:rgba(139,125,107,0.08);--border-subtle:rgba(139,125,107,0.15);--border-visible:rgba(139,125,107,0.25);--border-gold:rgba(196,163,90,0.3);--font-ui:system-ui,sans-serif;--font-narrative:Georgia,'Noto Serif SC',serif;--font-mono:'SF Mono','Fira Code',monospace;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--r-sm:3px;--r-md:5px;--shadow-sm:0 1px 3px rgba(0,0,0,0.4);--shadow-md:0 4px 12px rgba(0,0,0,0.5);--shadow-inset:inset 0 1px 3px rgba(0,0,0,0.3)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);font-size:13px;line-height:1.5;color:var(--text-parchment);background:var(--bg-abyss);-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.035;background:repeating-conic-gradient(rgba(200,180,150,0.03) 0% 25%,transparent 0% 50%) 0 0/4px 4px}
.game-container{display:grid;grid-template-columns:280px 1fr;grid-template-rows:1fr auto;height:100vh;width:100vw}
.sidebar{grid-row:1/3;background:var(--bg-deep);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sidebar::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(196,163,90,0.02) 0%,transparent 30%,transparent 70%,rgba(0,0,0,0.15) 100%);z-index:1}
.sidebar>*{position:relative;z-index:2}
.sidebar-header{padding:var(--sp-4) var(--sp-4) var(--sp-3);border-bottom:1px solid var(--border-dark);text-align:center}
.game-title{font-family:var(--font-narrative);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--san-gold);text-shadow:0 0 20px rgba(196,163,90,0.2);animation:flicker 8s ease-in-out infinite}
.game-subtitle{font-size:10px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-top:2px}
.char-name-block{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-dark)}
.char-name{font-family:var(--font-narrative);font-size:16px;color:var(--text-bright);font-style:italic}
.char-archetype{font-size:11px;color:var(--text-dim);margin-top:1px}
.vitals{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-dark);display:flex;flex-direction:column;gap:var(--sp-2)}
.vital-row{display:grid;grid-template-columns:32px 1fr 48px;align-items:center;gap:var(--sp-2)}
.vital-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.vital-label.san{color:var(--san-gold)}.vital-label.hp{color:var(--hp-crimson)}.vital-label.mp{color:var(--mp-arcane)}
.vital-bar-track{height:16px;background:rgba(0,0,0,0.4);border-radius:2px;border:1px solid var(--border-dark);overflow:hidden}
.vital-bar-fill{height:100%;border-radius:1px;transition:width 0.6s ease;position:relative}
.vital-bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.06) 50%,transparent 100%);animation:bar-shimmer 3s ease-in-out infinite}
.vital-bar-fill.san{background:linear-gradient(90deg,var(--san-gold-dim),var(--san-gold));box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 0 8px rgba(196,163,90,0.2)}
.vital-bar-fill.hp{background:linear-gradient(90deg,var(--hp-crimson-dim),var(--hp-crimson));box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 0 8px rgba(168,50,50,0.2)}
.vital-bar-fill.mp{background:linear-gradient(90deg,var(--mp-arcane-dim),var(--mp-arcane));box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 0 8px rgba(123,94,167,0.15)}
@keyframes bar-shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.vital-value{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:right}
.scene-info{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-dark)}
.scene-label{font-size:10px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:var(--sp-1)}
.scene-name{font-family:var(--font-narrative);font-size:14px;color:var(--text-bright);font-style:italic}
.scene-time{font-size:11px;color:var(--text-dim);margin-top:2px}
.dread-indicator{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.dread-pips{display:flex;gap:3px}
.dread-pip{width:8px;height:8px;border-radius:50%;border:1px solid var(--border-visible);transition:all 0.3s ease}
.dread-pip.filled{background:var(--supernatural);border-color:var(--supernatural);box-shadow:0 0 6px rgba(107,74,138,0.4)}
.dread-pip.empty{background:transparent}
.dread-text{font-size:10px;color:var(--supernatural);letter-spacing:0.5px}
.clue-tracker{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.clue-icon{font-size:12px;color:var(--san-gold)}.clue-text{font-size:11px;color:var(--text-muted)}
.clue-count{font-family:var(--font-mono);color:var(--san-gold)}
.skills-section{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-dark);flex:1;overflow-y:auto}
.skills-section-label{font-size:10px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:var(--sp-2)}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.skill-btn{background:var(--bg-surface);border:1px solid var(--border-dark);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);color:var(--text-parchment);font-size:11px;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;justify-content:space-between}
.skill-btn:hover{border-color:var(--border-gold);background:var(--bg-elevated);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.skill-btn:active{transform:translateY(0);box-shadow:var(--shadow-inset)}
.skill-btn-name{position:relative;z-index:1}.skill-btn-value{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.sidebar-actions{padding:var(--sp-3) var(--sp-4) var(--sp-4);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border-dark)}
.action-btn{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);color:var(--text-parchment);font-size:12px;cursor:pointer;transition:all 0.2s ease;text-align:center}
.action-btn:hover{background:var(--bg-elevated);border-color:var(--border-visible)}
.action-btn.primary{background:linear-gradient(180deg,rgba(196,163,90,0.12),rgba(196,163,90,0.05));border-color:var(--border-gold);color:var(--san-gold)}
.action-btn.primary:hover{background:linear-gradient(180deg,rgba(196,163,90,0.18),rgba(196,163,90,0.08));box-shadow:0 0 12px rgba(196,163,90,0.1)}
.main-area{display:flex;flex-direction:column;background:var(--bg-primary);overflow:hidden;position:relative}
.main-area::before{content:'';position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(10,14,20,0.6),transparent);pointer-events:none;z-index:2}
.chat-header{padding:var(--sp-3) var(--sp-6);border-bottom:1px solid var(--border-dark);display:flex;align-items:center;justify-content:space-between;background:var(--bg-deep);z-index:3;min-height:44px}
.chat-header-left{display:flex;align-items:center;gap:var(--sp-3)}
.kp-badge{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(143,188,106,0.4);animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{opacity:1}50%{opacity:0.7}}
.chat-header-title{font-family:var(--font-narrative);font-size:13px;color:var(--text-muted);font-style:italic}
.chat-header-right{display:flex;align-items:center;gap:var(--sp-3)}
.header-icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:var(--sp-1);border-radius:var(--r-sm)}.header-icon-btn:hover{color:var(--text-parchment);background:var(--bg-hover)}
.messages{flex:1;overflow-y:auto;padding:var(--sp-6) var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-6);scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:6px}.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:rgba(139,125,107,0.15);border-radius:3px}.messages::-webkit-scrollbar-thumb:hover{background:rgba(139,125,107,0.25)}
.narrative-block{position:relative;padding-left:var(--sp-5)}.narrative-block::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--border-gold),transparent);border-radius:1px}
.narrative-sender{font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-bottom:var(--sp-1)}
.narrative-text{font-family:var(--font-narrative);font-size:15px;line-height:1.85;color:var(--text-parchment);text-align:justify}
.dice-result{background:var(--bg-surface);border:1px solid var(--border-dark);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin:var(--sp-2) 0;position:relative;overflow:hidden}.dice-result::before{content:'';position:absolute;inset:0;opacity:0.04;pointer-events:none}
.dice-result.success{border-left:3px solid var(--success)}.dice-result.success::before{background:var(--success)}
.dice-result.fail{border-left:3px solid var(--fail)}.dice-result.fail::before{background:var(--fail)}
.dice-result.critical{border-left:3px solid var(--critical)}.dice-result.critical::before{background:var(--critical)}
.dice-result.fumble{border-left:3px solid var(--fail)}.dice-result.fumble::before{background:var(--fail);opacity:0.08}
.dice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-1)}
.dice-skill-name{font-size:12px;font-weight:600;color:var(--text-parchment)}
.dice-outcome{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.dice-outcome.success{background:rgba(143,188,106,0.12);color:var(--success)}
.dice-outcome.fail{background:rgba(199,80,80,0.12);color:var(--fail)}
.dice-outcome.critical{background:rgba(232,160,32,0.12);color:var(--critical)}
.dice-outcome.fumble{background:rgba(199,80,80,0.15);color:var(--fail)}
.dice-numbers{display:flex;align-items:baseline;gap:var(--sp-2);font-family:var(--font-mono);font-size:13px;color:var(--text-muted)}.dice-rolled{font-size:22px;font-weight:700;line-height:1}
.dice-rolled.success{color:var(--success)}.dice-rolled.fail{color:var(--fail)}.dice-rolled.critical{color:var(--critical)}.dice-rolled.fumble{color:var(--fail)}
.dice-target{font-size:12px;color:var(--text-dim)}.dice-narrative{font-family:var(--font-narrative);font-size:13px;color:var(--text-muted);line-height:1.6;margin-top:var(--sp-2);font-style:italic}
.system-msg{text-align:center;font-size:11px;color:var(--text-dim);padding:var(--sp-2) 0;letter-spacing:0.5px}.system-msg::before,.system-msg::after{content:' —— ';color:var(--border-subtle)}
.player-action{align-self:flex-end;max-width:70%;background:linear-gradient(135deg,rgba(196,163,90,0.06),rgba(196,163,90,0.02));border:1px solid var(--border-dark);border-right:3px solid var(--border-gold);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4)}
.player-action-label{font-size:10px;color:var(--san-gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:var(--sp-1);text-align:right}
.player-action-text{font-family:var(--font-narrative);font-size:14px;color:var(--text-parchment);line-height:1.7;text-align:right}
.input-area{grid-column:2;padding:var(--sp-3) var(--sp-6) var(--sp-4);background:var(--bg-deep);border-top:1px solid var(--border-dark)}
.input-wrapper{display:flex;gap:var(--sp-2);align-items:flex-end}
.input-field{flex:1;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);color:var(--text-parchment);font-family:var(--font-narrative);font-size:14px;resize:none;outline:none;transition:border-color 0.2s;min-height:44px;max-height:120px}.input-field::placeholder{color:var(--text-dim);font-style:italic}.input-field:focus{border-color:var(--border-gold);box-shadow:0 0 0 1px rgba(196,163,90,0.1)}
.send-btn{background:linear-gradient(180deg,rgba(196,163,90,0.15),rgba(196,163,90,0.05));border:1px solid var(--border-gold);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-5);color:var(--san-gold);font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;min-height:44px}.send-btn:hover{background:linear-gradient(180deg,rgba(196,163,90,0.22),rgba(196,163,90,0.1));box-shadow:0 0 16px rgba(196,163,90,0.12);transform:translateY(-1px)}.send-btn:active{transform:translateY(0);box-shadow:var(--shadow-inset)}.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.input-hints{display:flex;gap:var(--sp-4);margin-top:var(--sp-1);padding-left:var(--sp-1)}.hint-item{font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:var(--sp-1)}
.hint-key{background:var(--bg-surface);border:1px solid var(--border-dark);border-radius:2px;padding:0 4px;font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}
.san-dialog{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.7)}.san-dialog.show{display:flex;align-items:center;justify-content:center}
.san-dialog-content{background:var(--bg-deep);border:1px solid var(--mp-arcane);border-radius:var(--r-lg);padding:var(--sp-6);max-width:400px;text-align:center}.san-dialog-content input{display:block;width:100%;margin:8px 0;padding:8px;background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-parchment);border-radius:var(--r-md)}
@keyframes flicker{0%,100%{opacity:1}5%{opacity:0.95}10%{opacity:1}15%{opacity:0.97}50%{opacity:1}55%{opacity:0.93}60%{opacity:1}}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.sidebar{animation:fade-in 0.6s ease 0.1s both}.chat-header{animation:fade-in 0.4s ease 0.2s both}
.narrative-block,.dice-result,.player-action{animation:fade-up 0.5s ease both}
.input-area{animation:fade-in 0.4s ease 0.4s both}
@media(max-width:800px){.game-container{grid-template-columns:1fr}.sidebar{max-height:200px;overflow-x:auto}}
</style></head><body>
<div class="game-container">
<aside class="sidebar">
<div class="sidebar-header"><div class="game-title">克苏鲁的呼唤</div><div class="game-subtitle">Seventh Edition</div></div>
<div class="char-name-block"><div class="char-name" id="coc-char-name">詹姆斯·卡特</div><div class="char-archetype" id="coc-char-info">私家侦探 · 波士顿</div></div>
<div class="vitals"><div class="vital-row"><span class="vital-label san">SAN</span><div class="vital-bar-track"><div class="vital-bar-fill san" id="san-bar" style="width:93%"></div></div><span class="vital-value" id="san-val">65/70</span></div><div class="vital-row"><span class="vital-label hp">HP</span><div class="vital-bar-track"><div class="vital-bar-fill hp" id="hp-bar" style="width:100%"></div></div><span class="vital-value" id="hp-val">11/11</span></div><div class="vital-row"><span class="vital-label mp">MP</span><div class="vital-bar-track"><div class="vital-bar-fill mp" id="mp-bar" style="width:100%"></div></div><span class="vital-value" id="mp-val">14/14</span></div></div>
<div class="scene-info"><div class="scene-label">当前场景</div><div class="scene-name" id="scene-name">委托人到访</div><div class="dread-indicator"><span class="scene-label" style="margin:0">恐惧等级</span><div class="dread-pips" id="dread-pips"><div class="dread-pip filled"></div><div class="dread-pip empty"></div><div class="dread-pip empty"></div><div class="dread-pip empty"></div><div class="dread-pip empty"></div><div class="dread-pip empty"></div></div><span class="dread-text" id="dread-text"></span></div><div class="clue-tracker"><span class="clue-icon">♦</span><span class="clue-text">线索 <span class="clue-count" id="clue-count">0 / 0</span></span></div></div>
<div class="skills-section"><div class="skills-section-label">快捷检定</div><div class="skill-grid" id="skill-grid"></div></div>
<div class="sidebar-actions"><button class="action-btn primary" onclick="showSanDialog()">🧿 SAN 检定</button><button class="action-btn" onclick="rollD100()">🎯 掷 D100</button><button class="action-btn">📝 车卡</button></div></aside>
<main class="main-area"><div class="chat-header"><div class="chat-header-left"><div class="kp-badge"></div><span class="chat-header-title">守秘人正在叙述...</span></div><div class="chat-header-right"><span style="color:var(--text-dim);font-size:10px" id="api-status">● 已连接</span></div></div><div class="messages" id="messages"><div class="system-msg">调查开始 — 第一幕</div></div></main>
<div class="input-area"><div class="input-wrapper"><textarea class="input-field" id="input-field" rows="1" placeholder="描述你的行动..."></textarea><button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button></div><div class="input-hints"><span class="hint-item"><span class="hint-key">Enter</span> 发送</span><span class="hint-item"><span class="hint-key">Shift+Enter</span> 换行</span></div></div></div>
<div class="san-dialog" id="san-dialog"><div class="san-dialog-content"><h3 style="color:var(--mp-arcane);margin-bottom:12px">🧿 SAN 检定</h3><input id="san-reason" placeholder="触发原因 (如: 看到Corbitt)"><input id="san-loss" placeholder="损失公式 (如: 0/1d6)" value="0/1d6"><button class="action-btn primary" onclick="doSanCheck()" style="width:100%;margin-top:8px">掷 SAN 检定</button><button class="action-btn" onclick="document.getElementById('san-dialog').classList.remove('show')" style="width:100%;margin-top:4px">取消</button></div></div>
<script>
var API='http://localhost:8000/api/plugins/coc-rules-engine', ST_API='http://localhost:8000/api';
var char={name:'詹姆斯·卡特',san:70,sanMax:99,hp:11,hpMax:11,mp:14,mpMax:14,skills:{'侦查':70,'聆听':40,'图书馆使用':60,'心理学':60,'潜行':30,'话术':40,'闪避':27,'格斗(斗殴)':50,'射击(手枪)':40,'急救':30,'驾驶(汽车)':30,'信用评级':30}};

function showSanDialog(){document.getElementById('san-dialog').classList.add('show')}
async function doSanCheck(){var r=document.getElementById('san-reason').value||'恐惧',l=document.getElementById('san-loss').value||'0/1d6';document.getElementById('san-dialog').classList.remove('show');try{var resp=await fetch(API+'/roll/san-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentSAN:char.san,sanLoss:l,reason:r})});var d=await resp.json();char.san=d.newSAN;updateVitals();addDiceResult(d,'SAN检定');}catch(e){}}
async function rollD100(){try{var r=await fetch(API+'/roll/d100');var d=await r.json();addSystemMsg('🎯 D100: '+d.roll);}catch(e){}}
async function rollSkill(skill,val){try{var r=await fetch(API+'/roll/skill-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skillName:skill,skillValue:val})});var d=await r.json();addDiceResult(d,skill+'检定');}catch(e){}}

function addDiceResult(d,label){var lv=d.level||'regular';var cls=lv==='critical'?'critical':lv==='fumble'?'fumble':d.success?'success':'fail';var lvName={critical:'✨ 大成功',extreme:'🌟 极难成功',hard:'⭐ 困难成功',regular:'✅ 成功',fail:'❌ 失败',fumble:'💀 大失败'}[lv]||lv;var h='<div class="dice-result '+cls+'"><div class="dice-header"><span class="dice-skill-name">'+label+' ('+(d.skillValue||'')+'%)</span><span class="dice-outcome '+cls+'">'+lvName+'</span></div><div class="dice-numbers"><span class="dice-rolled '+cls+'">'+(d.roll||'')+'</span></div></div>';document.getElementById('messages').insertAdjacentHTML('beforeend',h);scrollMsgs()}
function addSystemMsg(text){document.getElementById('messages').insertAdjacentHTML('beforeend','<div class="system-msg">'+text+'</div>');scrollMsgs()}
function addPlayerMsg(text){document.getElementById('messages').insertAdjacentHTML('beforeend','<div class="player-action"><div class="player-action-label">'+char.name+'</div><div class="player-action-text">'+text+'</div></div>');scrollMsgs()}
function addKpMsg(text){document.getElementById('messages').insertAdjacentHTML('beforeend','<div class="narrative-block"><div class="narrative-sender">守秘人</div><div class="narrative-text">'+text+'</div></div>');scrollMsgs()}
function scrollMsgs(){var m=document.getElementById('messages');setTimeout(function(){m.scrollTop=m.scrollHeight},50)}
function updateVitals(){document.getElementById('san-val').textContent=char.san+'/'+char.sanMax;document.getElementById('hp-val').textContent=char.hp+'/'+char.hpMax;document.getElementById('mp-val').textContent=char.mp+'/'+char.mpMax;document.getElementById('san-bar').style.width=(char.san/char.sanMax*100)+'%';document.getElementById('hp-bar').style.width=(char.hp/char.hpMax*100)+'%';document.getElementById('mp-bar').style.width=(char.mp/char.mpMax*100)+'%'}

async function sendMessage(){var ta=document.getElementById('input-field'),btn=document.getElementById('send-btn');var text=ta.value.trim();if(!text||btn.disabled)return;ta.value='';addPlayerMsg(text);btn.disabled=true;btn.textContent='...';try{var resp=await fetch(ST_API+'/backends/chat-completions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}],stream:false})});var d=await resp.json();if(d.choices&&d.choices[0])addKpMsg(d.choices[0].message.content);else addSystemMsg('AI 响应异常');}catch(e){addSystemMsg('❌ 连接失败: '+e.message)}btn.disabled=false;btn.textContent='发送'}
async function loadScene(){try{var r=await fetch(API+'/scene/current');var d=await r.json();document.getElementById('scene-name').textContent=d.scene.name;var pips='';for(var i=0;i<6;i++)pips+='<div class="dread-pip '+(i<d.scene.dread?'filled':'empty')+'"></div>';document.getElementById('dread-pips').innerHTML=pips;var dd=['','平静','不安','紧张','恐惧','恐怖','梦魇'];document.getElementById('dread-text').textContent=dd[d.scene.dread]||'';}catch(e){}}
function buildSkillGrid(){var grid=document.getElementById('skill-grid'),sk=char.skills||{},keys=Object.keys(sk).slice(0,12);grid.innerHTML=keys.map(function(k){return '<button class="skill-btn" onclick="rollSkill(\''+k+'\','+sk[k]+')"><span class="skill-btn-name">'+k+'</span><span class="skill-btn-value">'+sk[k]+'%</span></button>'}).join('')}

document.getElementById('input-field').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
buildSkillGrid();loadScene();setInterval(loadScene,5000);
</script></body></html>
